<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form & Inputs</title>
</head>
<body>
        <form>
            <label for="name">Name:</label>
            <input type="text" name="name" placeholder="enter your name"><br> <br>
            
            <label for="email">Email:</label>
            <input type="email" <br><br>
            
            <label for="password">Password:</label>
            <input type="password" <br><br>
            
            <label for="age">Age:</label>
            <input type="number" <br><br>
            
            <!-- input for checkbox to select option englih or hindi-->
            <label for="english">Do you know English?</label>
            <input type="checkbox" name="english" value="yes"><br>

            <label for="hindi">Do you know Hindi?</label>
            <input type="checkbox" name="hindi" value="yes"><br>

            <!-- take radio for gender -->
            <label for="male">Male</label>
            <input type="radio" name="gender" value="male">

            <label for="female">Female</label>
            <input type="radio" name="gender" value="female">

            <label for="other">Other</label>
            <input type="radio" name="gender" value="other"><br>

            <label for="gender">Gender:</label>
            <select  name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <input type="file">
            
        </form>

</body>
</html>
