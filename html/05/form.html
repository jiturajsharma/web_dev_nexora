<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table in html</title>
</head>
<body>
    
<!-- 
Explain these tags to students
<table> → creates the table
<tr> → creates a row
<th> → creates a heading cell
<td> → creates a normal data cell
border="1" → adds a simple border    
-->



    <h2>Student Table</h2>

<table border="1" align="center" >
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Class</th>
    </tr>

    <tr>
        <td>Rahul</td>
        <td>15</td>
        <td>10th</td>
    </tr>

    <tr>
        <td>Priya</td>
        <td>14</td>
        <td>9th</td>
    </tr>
</table>


</body>
</html>
